name: Test and build main

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
          cache: "npm"
      - run: npm install
      - run: npm run test:run
      - run: npm run build
